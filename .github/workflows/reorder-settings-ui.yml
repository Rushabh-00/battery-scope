name: Reorder settings UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-settings-ui.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Reorder settings sections
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("app/src/main/java/com/batteryscope/app/ui/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          marker = "@Composable\nprivate fun SettingsScreen("
          start = text.index(marker)
          lazy = text.index("            LazyColumn(", start)
          body_start = text.index("{", lazy)
          depth = 0
          body_end = None
          for i in range(body_start, len(text)):
              ch = text[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      body_end = i
                      break
          if body_end is None:
              raise SystemExit("Could not find Settings LazyColumn body")

          body = text[body_start + 1:body_end]
          lines = body.splitlines(keepends=True)
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith("                item {") or line.startswith("                item { "):
                  block = [line]
                  depth = line.count("{") - line.count("}")
                  i += 1
                  while i < len(lines) and depth > 0:
                      block.append(lines[i])
                      depth += lines[i].count("{") - lines[i].count("}")
                      i += 1
                  blocks.append("".join(block))
              elif line.startswith("                item { NotificationSettingsSection(settings) }"):
                  blocks.append(line)
                  i += 1
              else:
                  i += 1

          if len(blocks) != 8:
              raise SystemExit(f"Expected 8 settings blocks, found {len(blocks)}")

          header = next(b for b in blocks if "Text(\"Settings\"" in b)
          desired = [
              next(b for b in blocks if "NotificationSettingsSection(settings)" in b),
              next(b for b in blocks if 'Section("Start on boot")' in b),
              next(b for b in blocks if 'Section("Telemetry")' in b),
              next(b for b in blocks if 'Section("Battery capacity")' in b),
              next(b for b in blocks if 'Section("Units")' in b),
              next(b for b in blocks if 'Section("Appearance")' in b),
              next(b for b in blocks if 'Section("App update")' in b),
          ]

          new_body = "\n" + "".join([header, *[b if b.endswith("\n") else b + "\n" for b in desired]])
          path.write_text(text[:body_start + 1] + new_body + text[body_end:], encoding="utf-8")

          verify = path.read_text(encoding="utf-8")
          order = [
              "NotificationSettingsSection(settings)",
              'Section("Start on boot")',
              'Section("Telemetry")',
              'Section("Battery capacity")',
              'Section("Units")',
              'Section("Appearance")',
              'Section("App update")',
          ]
          positions = [verify.index(x, start) for x in order]
          if positions != sorted(positions):
              raise SystemExit("Settings section order verification failed")

      - name: Commit reordered settings UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/batteryscope/app/ui/MainActivity.kt .github/workflows/reorder-settings-ui.yml
          git rm .github/workflows/reorder-settings-ui.yml
          git commit -m "Reorder settings UI"
          git push origin main
