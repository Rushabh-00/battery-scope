name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: "Publish the build as a GitHub test release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 1 • Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Validate Gradle project
        run: gradle help

  build:
    name: 2 • Build APKs
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  quality:
    name: 3 • Quality & verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-APKs
          path: dist

      - name: Verify APKs
        run: |
          echo "Built APK files:"
          find dist -name '*.apk' -type f -print
          test -n "$(find dist -name '*.apk' -type f -print -quit)"

  package:
    name: 4 • Package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-APKs
          path: dist

      - name: Create checksums
        run: |
          sha256sum dist/**/*.apk | tee SHA256SUMS.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-final
          path: |
            dist/**/*.apk
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: 5 • Publish test release
    needs: package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_test_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download final package
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-final
          path: dist

      - name: Publish automatic test release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-build.${{ github.run_number }}
          name: BatteryScope 0.2.0 test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/**/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*.apk

      - name: Publish manual test release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-manual.${{ github.run_number }}
          name: BatteryScope 0.2.0 manual test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/**/*.apk
