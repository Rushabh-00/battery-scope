name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.6.0'

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          cache-cleanup: on-success
          add-job-summary: on-failure

      - name: Build release APK
        run: gradle assembleRelease --configuration-cache --build-cache --parallel

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing repository secret: $name"; exit 1; }
          done

          mkdir -p dist
          keystore="$RUNNER_TEMP/batteryscope-release.jks"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/BatteryScope-aligned.apk"
          output="dist/BatteryScope-release.apk"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          test -s "$unsigned"

          zipalign_bin=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool_bin="$JAVA_HOME/bin/keytool"

          test -x "$zipalign_bin"
          test -x "$apksigner_bin"
          test -x "$keytool_bin"

          "$keytool_bin" -list \
            -storetype JKS \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          "$zipalign_bin" -P 16 -f 4 "$unsigned" "$aligned"
          "$apksigner_bin" sign \
            --ks "$keystore" \
            --ks-type JKS \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            "$aligned"
          "$apksigner_bin" verify --verbose "$output"

          rm -f "$keystore" "$aligned"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag || format('build-{0}', github.sha)) }}
          target_commitish: ${{ github.sha }}
          name: BatteryScope ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag || format('build-{0}', github.sha)) }}
          prerelease: false
          generate_release_notes: true
          files: dist/BatteryScope-release.apk
          fail_on_unmatched_files: true
