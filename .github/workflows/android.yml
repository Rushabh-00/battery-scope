name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: "Publish the build as a GitHub test release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 1 • Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Validate Gradle project
        run: gradle help

  quality:
    name: 2 • Quality checks
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Run unit tests
        run: gradle test --stacktrace

  build:
    name: 3 • Build APKs
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryScope-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  verify:
    name: 4 • Verify APKs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-debug
          path: dist/debug

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-release
          path: dist/release

      - name: Verify APK files
        run: |
          set -e
          echo "Debug APK:"
          ls -lh dist/debug
          echo "Release APK:"
          ls -lh dist/release
          test -s "$(find dist/debug -name '*.apk' -print -quit)"
          test -s "$(find dist/release -name '*.apk' -print -quit)"

  publish:
    name: 5 • Publish test release
    needs: [build, verify]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_test_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-debug
          path: dist/debug

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryScope-release
          path: dist/release

      - name: Publish automatic test release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-build.${{ github.run_number }}
          name: BatteryScope 0.2.0 test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/debug/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/*.apk

      - name: Publish manual test release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-manual.${{ github.run_number }}
          name: BatteryScope 0.2.0 manual test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/debug/*.apk
